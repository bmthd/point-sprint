name: Set up Node and pnpm
description: Installs the Node and pnpm in package.json through mise, and restores the pnpm store when asked.

inputs:
  cache:
    description: Whether to restore the pnpm store, keyed on the lockfile, and save it after the job.
    default: "false"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v5.2.4
    - id: store
      if: inputs.cache == 'true'
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - if: inputs.cache == 'true'
      uses: actions/cache@v4.3.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-store-
