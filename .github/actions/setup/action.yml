name: Set up Node and pnpm
description: Installs the Node and pnpm in package.json through mise, and restores the pnpm store when asked.

inputs:
  cache:
    description: Whether to restore the pnpm store, keyed on the lockfile, and save it after the job.
    default: "false"
  mise-env:
    description: >-
      The mise environment, which overrides the dev in .miserc.toml. "production" installs only the
      tools in mise.toml, and "dev" also those in mise.dev.toml.
    default: production

runs:
  using: composite
  steps:
    # Through GITHUB_ENV, so mise in the later steps of the job reads the same files.
    - shell: bash
      run: echo "MISE_ENV=$MISE_ENV_INPUT" >> "$GITHUB_ENV"
      env:
        MISE_ENV_INPUT: ${{ inputs.mise-env }}
    - uses: jdx/mise-action@v5.2.4
    - id: store
      if: inputs.cache == 'true'
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - if: inputs.cache == 'true'
      uses: actions/cache@v4.3.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-store-
