name: CI

# Docs, the Markdown at the root and .github are never read by the site, its tests or its build.
# A push to main of only those runs nothing. A pull request still runs every job, since the
# ruleset requires them, and its jobs skip their steps by what the "changes" job finds.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!*.md"
      - "!.github/**"
      - ".github/workflows/ci.yml"
      - ".github/actions/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.files.outputs.app }}
    steps:
      # The same paths as on.push.paths above. A push got here only through them, and a list that
      # cannot be read (a diff too large) counts as touching the app.
      - id: files
        run: |
          app=true
          if [ "$EVENT" = pull_request ] && files=$(gh pr diff "$PR_NUMBER" --name-only) &&
            ! grep -qvE '^(docs/|\.github/|[^/]+\.md$)' <<< "$files" &&
            ! grep -qE '^\.github/(workflows/ci\.yml|actions/)' <<< "$files"; then
            app=false
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  quality:
    name: Quality
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # To download the bundle size of main's latest build.
      actions: read
      # To comment the bundle size on the pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Also installs the development tools in mise.dev.toml, at the versions pinned there.
      - uses: $/.github/actions/setup
        with:
          cache: true
          mise-env: dev
      - run: pnpm install --frozen-lockfile
      - parallel:
          # Only formatting and spelling read the Markdown at the root and .github.
          - name: Lint
            if: needs.changes.outputs.app == 'true'
            run: pnpm lint
          - name: Check formatting
            run: pnpm fmt:check
          - name: Check types
            if: needs.changes.outputs.app == 'true'
            run: pnpm type:check
          - name: Check spelling
            run: pnpm spell:check
          - name: Build
            if: needs.changes.outputs.app == 'true'
            run: pnpm build
      # A pull request compares with the latest run on main that kept the sizes. Without one, the
      # summary shows the sizes alone.
      - name: Measure bundle size
        if: needs.changes.outputs.app == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          base=()
          if [ "$EVENT" = pull_request ]; then
            for run in $(gh run list --workflow ci.yml --branch main --event push --limit 20 \
              --json databaseId --jq '.[].databaseId'); do
              if gh run download "$run" --name bundle-size --dir "$RUNNER_TEMP/base" 2>/dev/null; then
                base=(--base "$RUNNER_TEMP/base/bundle-size.json")
                break
              fi
            done
          fi
          node apps/web/scripts/bundle-size.ts --out "$RUNNER_TEMP/bundle-size.json" "${base[@]}" \
            > "$RUNNER_TEMP/bundle-size.md"
          cat "$RUNNER_TEMP/bundle-size.md" >> "$GITHUB_STEP_SUMMARY"
      # One comment per pull request, rewritten by each run. A pull request from a fork gets a token
      # that cannot comment, and goes without.
      - name: Comment the bundle size
        if: github.event_name == 'pull_request' && needs.changes.outputs.app == 'true'
        continue-on-error: ${{ github.event.pull_request.head.repo.fork }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- bundle-size -->"
          body="$marker
          $(cat "$RUNNER_TEMP/bundle-size.md")"
          id=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body "$body"
          fi
      - name: Keep the bundle size
        if: github.event_name == 'push' && needs.changes.outputs.app == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: bundle-size
          path: ${{ runner.temp }}/bundle-size.json
          retention-days: 90
      # Checks the workflows, and their scripts with shellcheck, at the versions in mise.dev.toml, even
      # when a step above failed.
      - id: jactionlint
        if: ${{ !cancelled() }}
        run: echo "path=$(mise which jactionlint)" >> "$GITHUB_OUTPUT"
      - name: Check workflows
        if: ${{ !cancelled() }}
        uses: jdx/jactionlint@v2.3.0
        with:
          executable: ${{ steps.jactionlint.outputs.path }}

  # A skipped job passes the ruleset's required check.
  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright Chromium
        id: playwright
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      # Only the web-browser project needs Chromium, so the other projects run while it installs.
      - parallel:
          - name: Install Chromium
            if: steps.playwright.outputs.cache-hit != 'true'
            run: pnpm --filter web exec playwright install --with-deps chromium
          - name: Run tests
            run: pnpm test --project '!web-browser'
      - name: Run browser tests
        run: pnpm test --project web-browser

  e2e:
    name: E2E (${{ matrix.shard }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "1/2"
            artifact_suffix: shard-1-of-2
          - shard: "2/2"
            artifact_suffix: shard-2-of-2
    # A matrix job skipped as a whole never expands its name, so the required "E2E (1/2)" would
    # wait forever. Its steps are skipped instead.
    steps:
      - if: needs.changes.outputs.app == 'true'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.app == 'true'
        uses: $/.github/actions/setup
        with:
          cache: true
      - if: needs.changes.outputs.app == 'true'
        run: pnpm install --frozen-lockfile
      - name: Restore Playwright Chromium
        if: needs.changes.outputs.app == 'true'
        id: playwright
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - parallel:
          - name: Install Chromium
            if: needs.changes.outputs.app == 'true' && steps.playwright.outputs.cache-hit != 'true'
            run: pnpm --filter web exec playwright install --with-deps chromium
          - name: Build
            if: needs.changes.outputs.app == 'true'
            run: pnpm build:e2e
      - name: Run E2E tests
        if: needs.changes.outputs.app == 'true'
        run: pnpm --filter web exec playwright test --shard=${{ matrix.shard }}
      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-test-results-${{ matrix.artifact_suffix }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 30
