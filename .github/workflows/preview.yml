# Deploys each pull request as a Worker Preview and comments its URL on the PR.
# Production is untouched: a preview only uploads a version and points a URL at it.
name: Preview

# Docs, the Markdown at the root and .github are never read by the site, so a pull request of only
# those gets no preview. Any other change, apps/web's Markdown among them, builds one. Nothing
# requires this check, so the whole workflow can be skipped.
on:
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!*.md"
      - "!.github/**"
      - ".github/workflows/preview.yml"

# A newer push to the same pull request supersedes a preview still in progress.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    # The previews of every pull request search the guides' items with the same keys, which the API
    # allows one call a second: they take turns, so that their builds never call it at once.
    concurrency:
      group: preview-rakuten-keys
      queue: max
    # Holds the Rakuten keys of an application made for the previews alone, never production's.
    environment: preview
    # Builds without Google Analytics (vite.config.ts), so that the previews' visits stay out of
    # production's figures.
    env:
      PULL_REQUEST_PREVIEW: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Takes the pnpm version from packageManager in package.json.
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          runtime: node@26
          cache: true
      - run: pnpm install --frozen-lockfile
      # cf builds the preview itself, so this only runs the prerender check.
      # This job runs the PR's code, so it gets no key to .env.production. The guides' items are
      # listed with the keys of a Rakuten application made for the previews alone, which the PR's
      # code can read: a leaked key costs only making that application's keys anew, and a fork's PR
      # gets none. They are also in .env.development, for `pnpm dev` and local builds.
      - run: pnpm build
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      # The Worker's other secrets are not given, so cf warns they are missing and the inquiry stops
      # at `config`.
      # Previews share a database of their own, never production's (cloudflare.config.ts).
      - name: Migrate the preview's event master
        working-directory: apps/web
        run: pnpm db:migrate --preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy preview
        id: preview
        working-directory: apps/web
        run: |
          # A failed deploy fails the step, not only `tee`.
          set -o pipefail
          pnpm exec cf previews deploy "pr-$PR_NUMBER" | tee "$RUNNER_TEMP/preview.log"
          # The result is the JSON object at the end of the output.
          url=$(sed -n '/^{/,/^}/p' "$RUNNER_TEMP/preview.log" | jq -r '.preview_urls[0]')
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # cf builds with `vite build`, not `pnpm build`, so the keys reach Vite without dotenvx.
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      - name: Comment the preview URL
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none \
            --body "Preview: $URL (${HEAD_SHA::7})"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Turns root-relative links under "## レビュー観点" in the PR body into preview links,
      # so the author can list pages by path before the URL exists.
      - name: Link the pages listed in the PR body
        run: |
          gh pr view "$PR_NUMBER" --json body --jq .body > "$RUNNER_TEMP/body.md"
          perl -pe 'if (/^## /) { $in = /^## レビュー観点\s*$/ } s{\]\(/}{]($ENV{URL}/}g if $in' \
            "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/linked.md"
          if ! cmp -s "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/linked.md"; then
            gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/linked.md"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
