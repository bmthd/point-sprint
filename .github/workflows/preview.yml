# Deploys each pull request as a Worker Preview and comments its URL on the PR.
# Production is untouched: a preview only uploads a version and points a URL at it.
name: Preview

on:
  pull_request:

# A newer push to the same pull request supersedes a preview still in progress.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Takes the pnpm version from packageManager in package.json.
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          runtime: node@26
          cache: true
      - run: pnpm install --frozen-lockfile
      # cf builds the preview itself, so this only runs the prerender check.
      - run: pnpm build
      - name: Deploy preview
        id: preview
        working-directory: apps/web
        run: |
          pnpm exec cf previews deploy "pr-$PR_NUMBER" | tee "$RUNNER_TEMP/preview.log"
          # The result is the JSON object at the end of the output.
          url=$(sed -n '/^{/,/^}/p' "$RUNNER_TEMP/preview.log" | jq -r '.preview_urls[0]')
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: Comment the preview URL
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none \
            --body "Preview: $URL (${HEAD_SHA::7})"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Turns root-relative links under "## レビュー観点" in the PR body into preview links,
      # so the author can list pages by path before the URL exists.
      - name: Link the pages listed in the PR body
        run: |
          gh pr view "$PR_NUMBER" --json body --jq .body > "$RUNNER_TEMP/body.md"
          perl -pe 'if (/^## /) { $in = /^## レビュー観点\s*$/ } s{\]\(/}{]($ENV{URL}/}g if $in' \
            "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/linked.md"
          if ! cmp -s "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/linked.md"; then
            gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/linked.md"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
