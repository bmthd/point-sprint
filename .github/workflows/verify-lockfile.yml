name: Verify lockfile

# Fails when .github/workflows/actions.lock is out of sync with the workflows, or a locked commit no
# longer matches its tag upstream. The weekly run catches a tag that was moved after it was locked.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/**"
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: verify-lockfile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.0
      - run: gh actions-lock --verify
