# Opens an issue when the site serves no official event that runs a week from now: the Worker's cron
# collects them from Rakuten's pages, so the collection has stopped or held a round back
# (docs/event-master.md).
name: Event master

on:
  schedule:
    # 09:00 in Japan.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check upcoming events
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The check reads the site's /events.json, so it needs Node to strip the types but no install.
      - uses: ./.github/actions/setup
      - id: check
        name: Check the served events
        continue-on-error: true
        # A failed check fails the step, not only `tee`.
        run: |
          set -o pipefail
          node packages/domain/scripts/check-event-master.ts 2>&1 | tee "$RUNNER_TEMP/check.txt"
      # A failure for any other reason also opens the issue, which links to this run's log.
      - name: Open an issue
        if: ${{ steps.check.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: 公式イベントの収集を確かめる
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOC_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/event-master.md
        run: |
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json title \
            --jq '[.[] | select(.title == env.TITLE)] | length')
          if [ "$open" != "0" ]; then
            echo "An issue is already open."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$(cat <<EOF
          $(cat "$RUNNER_TEMP/check.txt")

          トップページは終了していないイベントだけを出すため、このままでは「開催中・開催予定のイベント」が空になります。収集が止まっているか、検査を通らずに保留になっているおそれがあります。[docs/event-master.md]($DOC_URL) の手順で収集の記録を確かめ、必要なら行を直してください。

          検知したワークフロー: $RUN_URL
          EOF
          )"
