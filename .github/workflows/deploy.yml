# Deploys the site to Cloudflare Workers on every push to main.
name: Deploy

# Docs, the Markdown at the root and .github are never read by the site, so a push of only those
# deploys nothing; workflow_dispatch still deploys by hand. A skipped push never enters the
# queue below, so it cannot take the place of a push still waiting to deploy.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!*.md"
      - "!.github/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Deploys queue instead of cancelling, so a running `cf deploy` is never
# interrupted mid-way; the latest queued push still wins.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      # dotenvx decrypts the Rakuten keys in .env.production, which the prerendering of the guides
      # uses. `pnpm build` alone takes the Previews' keys from .env.development, which do not
      # override these, so that builds elsewhere never share the production application's rate. The
      # public values are plain text and are built in without the key.
      - run: pnpm exec dotenvx run -q -f .env.production -- pnpm build
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
      # The event master's new tables go in before the version that reads them (docs/event-master.md).
      - name: Migrate the event master
        working-directory: apps/web
        run: pnpm db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The Worker's secrets (`bindings.secret()` in cloudflare.config.ts) go up with each version,
      # decrypted from .env.production. Only those keys are written, so CLOUDFLARE_API_TOKEN stays
      # out of the Worker. --strict fails the step when the file cannot be decrypted, and cf
      # refuses to deploy while a declared secret has no value.
      - name: Deploy
        working-directory: apps/web
        run: |
          umask 077
          secrets="$RUNNER_TEMP/worker-secrets.json"
          pnpm exec dotenvx get -f ../../.env.production --strict \
            -ik TURNSTILE_SECRET_KEY INQUIRY_TO_ADDRESS RAKUTEN_APPLICATION_ID RAKUTEN_ACCESS_KEY \
            > "$secrets"
          jq -r '.[] | "::add-mask::" + .' "$secrets"
          pnpm exec cf deploy --prebuilt --message "${GITHUB_SHA::7}" --secrets-file "$secrets"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
