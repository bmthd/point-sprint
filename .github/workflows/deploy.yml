# Deploys the site to Cloudflare Workers on every push to main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes a deploy still in progress.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Takes the pnpm version from packageManager in package.json.
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          runtime: node@26
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy
        working-directory: apps/web
        run: pnpm exec cf deploy --prebuilt --message "${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
