# Audits the production dependencies apart from CI, so an advisory published today fails no pull
# request that leaves the lockfile alone. A run on a schedule or on main that finds one opens an
# issue. A pull request that changes the lockfile shows the result as a check the ruleset does not
# require.
name: Audit

on:
  schedule:
    # 09:00 in Japan.
    - cron: "0 0 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - pnpm-lock.yaml
      - .github/workflows/audit.yml
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm audit reads only the lockfile, so it needs no install.
      - uses: ./.github/actions/setup
      - id: audit
        name: Audit production dependencies
        # A failed audit fails the step, not only `tee`.
        run: |
          set -o pipefail
          pnpm audit --prod 2>&1 | tee "$RUNNER_TEMP/audit.txt"
      # A failure for any other reason also opens the issue, which links to this run's log.
      - name: Open an issue
        if: ${{ failure() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: 依存パッケージの脆弱性を直す
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json title \
            --jq '[.[] | select(.title == env.TITLE)] | length')
          if [ "$open" != "0" ]; then
            echo "An issue is already open."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$(cat <<EOF
          \`pnpm audit --prod\` が本番の依存パッケージに脆弱性を見つけました。修正された版へ上げるか、上げられないときは \`pnpm-workspace.yaml\` の \`overrides\` で版を指定してください。

          \`\`\`text
          $(head -c 60000 "$RUNNER_TEMP/audit.txt" 2>/dev/null)
          \`\`\`

          検知したワークフロー: $RUN_URL
          EOF
          )"
