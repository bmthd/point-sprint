# Tools for development only: checks that run locally and in CI's Quality job, never in a build or
# a deploy. mise reads this file only when MISE_ENV=dev, so the setup action installs just the Node
# and pnpm in mise.toml for the other jobs. Run `MISE_ENV=dev mise install` to install these.
[tools]
"github:jdx/jactionlint" = "2.6.0"
shellcheck = "0.11.0"
